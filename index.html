<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 배너 규격화 시스템</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            /* 배경 투명도를 0.3으로 더 줄여서 배경을 훨씬 밝게 처리 */
            background-color: rgba(26, 26, 26, 0.3); 
            font-family: 'Noto Sans KR', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-card {
            background-color: #F4F4F4;
            width: 800px;
            padding: 50px 60px 65px;
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15); /* 그림자도 더 부드럽게 조정 */
            text-align: center;
        }

        .portal-title {
            color: #333333; 
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        .button-row { display: flex; justify-content: center; gap: 20px; }

        .nav-button {
            flex: 1;
            padding: 22px 0;
            font-size: 20px;
            font-weight: 900;
            text-decoration: none;
            color: #FF6B9D;
            background-color: #FFFFFF;
            border: 3px solid #FF6B9D;
            border-radius: 12px; 
            transition: all 0.3s ease;
            display: inline-block;
        }

        .nav-button:hover {
            background-color: #FF6B9D;
            color: #FFFFFF;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(255, 107, 157, 0.2);
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <h1 class="portal-title">통합 배너 규격화</h1>

        <div class="button-row">
            <a href="https://mjmlscompany-lab.github.io/banner/" class="nav-button">통합 배너 작업</a>
            <a href="https://mjmlscompany-lab.github.io/top_banner/" class="nav-button">띠배너 생성기</a>
        </div>
    </div>

</body>
</html>
