<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>통합 배너 규격화</title>
    <style>
        /* 메인 인트로 화면 스타일 */
        body { 
            margin: 0; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: #1a1a1a; color: #fff; font-family: 'Malgun Gothic', sans-serif; 
        }
        h1 { margin-bottom: 60px; color: #2ecc71; font-size: 32px; }
        .btn-wrapper { display: flex; gap: 40px; }
        
        .main-btn { 
            padding: 40px 80px; 
            font-size: 24px; 
            font-weight: bold; 
            color: #fff; 
            background: #333; 
            border: 2px solid #444; 
            border-radius: 25px; 
            cursor: pointer; 
            transition: 0.3s; 
            text-decoration: none; 
        }
        .main-btn:hover { 
            background: #2ecc71; 
            color: #000; 
            border-color: #2ecc71; 
            transform: scale(1.05); 
        }
    </style>
</head>
<body>
    <h1>통합 배너 규격화</h1>
    <div class="btn-wrapper">
        <a href="https://mjmlscompany-lab.github.io/banner/" class="main-btn">통합 배너 작업</a>
        <a href="https://mjmlscompany-lab.github.io/top_banner/" class="main-btn">띠배너 생성기</a>
    </div>
</body>
</html>
